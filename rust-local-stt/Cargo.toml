[package]
name = "kwispr-local-stt"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["vendor/transcribe-cpp-0.1.3"]
default-members = ["."]
resolver = "2"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["multipart"] }
hound = "3"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "time"] }
# transcribe-rs remains only for the existing Silero ONNX VAD.
transcribe-rs = { version = "0.3.8", default-features = false, features = ["vad-silero"] }
transcribe-cpp = { version = "=0.1.3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Match Handy's Linux runtime: loadable CPU variants plus Vulkan.
transcribe-cpp = { version = "=0.1.3", default-features = false, features = ["dynamic-backends", "vulkan"] }

# Pinned, reviewed decoder patch: static prompts without generated history.
# See vendor/README.md for provenance and the exact native changes.
[patch.crates-io]
transcribe-cpp = { path = "vendor/transcribe-cpp-0.1.3" }
transcribe-cpp-sys = { path = "vendor/transcribe-cpp-sys-0.1.3" }

[profile.release]
strip = true
